<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: LGPL-2.1-or-later
     MihawkOS title icon: the Mihawk mark of themes/windows11/start.svg (its three shapes, unchanged; tests/test_title_icon.py
     checks they stay the same) on a white tile, because the console's icon0.png is RGB, with no alpha.
     sce_sys/icon0.png is rendered from this: rsvg-convert -w 512 -h 512 icon0.svg, then saved as 8-bit RGB. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <rect width="100" height="100" fill="#FFFFFF"/>
  <rect x="1" y="1" width="98" height="98" rx="30" fill="#FFFFFF" stroke="#C9D3DD" stroke-width="2"/>
  <rect x="6" y="6" width="88" height="88" rx="25" fill="none" stroke="#FFB020" stroke-width="2"/>
  <polyline points="25,80.5 25,34.5 50,64.5 75,34.5 75,80.5" fill="none" stroke="#0E2B46" stroke-width="11" stroke-linejoin="miter" stroke-miterlimit="8"/>
</svg>
